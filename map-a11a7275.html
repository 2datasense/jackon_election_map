<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jackson Voting Explorer</title>

<style>
body{margin:0;background:#fff}
a{color:#024172}a:hover{color:#01294a}
.jx{--ink:#1b2430;--brand:#024172;--accent:#006EC3;--wash:#f4f7fb;--line:#dfe6ee;--dim:#5b6673;font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:#fff;min-height:100vh}
.jx *{box-sizing:border-box}.jx button,.jx select,.jx input{font:inherit}.jx button{cursor:pointer}
.jx button:focus-visible,.jx select:focus-visible,.jx input:focus-visible{outline:3px solid #7fb3e0;outline-offset:2px}
.jx select{width:100%;min-height:42px;border:1px solid #c5cfdb;border-radius:7px;background:#fff;padding:7px 10px;color:var(--ink)}
.jx input[type=checkbox]{accent-color:var(--brand)}
.jx .lbl{font-size:12px;font-weight:750;color:#46525f}
.jx .sw{background:#fff;border:1px solid #cfd8e3;padding:9px 15px;border-radius:7px;font-weight:700;color:var(--ink)}
.jx .sw[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.jx .seg{background:#fff;border:0;border-right:1px solid #c5cfdb;padding:0 14px;min-height:42px;font-weight:700;color:#1b2430}.jx .seg:last-child{border-right:0}.jx .seg[aria-pressed=true]{background:#024172;color:#fff}
.jx .reset{height:42px;background:#fff;border:1px solid #a9b9cc;color:#024172;border-radius:7px;padding:6px 16px;font-weight:700}
.jx .reset:hover{background:#eef4fa}
.jx .chip{font-size:12px;display:flex;gap:4px;align-items:center;padding:5px 7px;border-radius:6px;background:var(--wash)}
.jx .mapbox{position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none;height:min(68vh,740px);min-height:500px;background:#f3f5f8}
.jx .mapbox.dragging{cursor:grabbing}
.jx .district{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;fill-opacity:.85;fill-rule:evenodd;cursor:pointer;transition:fill .2s}
.jx .district:hover{stroke:#024172;stroke-width:2.5;fill-opacity:1}
.jx .district:focus{outline:none}.jx .district:focus-visible{stroke:#7fb3e0;stroke-width:3}
.jx .maptip{position:absolute;font-size:12px;line-height:1.2;text-align:center;padding:5px 7px;box-shadow:0 2px 9px #0002;border:1px solid #c9d3de;border-radius:7px;background:#fff;color:#1b2430;pointer-events:none}
.jx .maptip .big{font-size:15px;color:#024172;display:block;line-height:1.15;margin:1px 0;font-weight:700}
.jx .maptip .small{display:block;font-size:10px;color:#5b6673}
.jx .maptip .sec{display:block;color:#006EC3;font-weight:700;font-size:11px}
.jx .trow{display:grid;grid-template-columns:minmax(100px,1.1fr) minmax(90px,1.4fr) minmax(190px,2fr) minmax(80px,1fr) minmax(120px,1.4fr) minmax(90px,1fr);align-items:center;gap:12px;text-align:left;background:#ffffff;border:1px solid #dfe6ee;border-radius:8px;padding:8px 12px;min-height:44px;font-size:13px;color:#1b2430}
.jx .trow:hover{background:#f4f7fb}.jx .trow.on{background:#eef4fa;border-color:#024172}
.jx .tr-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e9eef4}
.jx .tr-pcts{display:flex;gap:10px;font-weight:700}
.jx .tr-lead{font-weight:800}.jx .pos{color:#01665e}.jx .neg{color:#8c510a}.jx .tr-chg{font-weight:700}
.jx .maptip.row{display:flex;align-items:baseline;justify-content:center;gap:6px;white-space:nowrap;padding:3px 6px}.jx .maptip .sub{font-size:11px;font-weight:600;color:#46525f}
.jx .maptip .lead{display:inline;font-size:13px;font-weight:800;line-height:1.2}.jx .maptip .la{color:#005a9e}.jx .maptip .lb{color:#9a5410}.jx .maptip .le{color:#01665e}.jx .maptip .lo{color:#8c510a}
.jx .maptip .big.eup{color:#01665e}.jx .maptip .big.edown{color:#8c510a}
@media(max-width:900px){.jx .trow{grid-template-columns:1fr 1fr}.jx .tr-bar{grid-column:1/-1;order:-1}}
.jx .trendbtn{border:1px solid #c5cfdb;border-radius:8px;margin-right:8px}
.jx .swatch{width:14px;height:14px;border-radius:3px;display:inline-block}
.jx .maptip .pe,.jx .maptip .po,.jx .maptip .pn{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3}
.jx .maptip .pe{color:#01665e}.jx .maptip .po{color:#8c510a}.jx .maptip .pn{color:#5b6673}
.jx .maptip.compact .pe,.jx .maptip.compact .po,.jx .maptip.compact .pn{font-size:11px;line-height:1.2}
.jx .maptip .pa,.jx .maptip .pb{display:flex;justify-content:space-between;gap:6px;font-size:12px;line-height:1.3}
.jx .maptip .pa{color:#005a9e}.jx .maptip .pb{color:#9a5410}
.jx .maptip .lead{font-weight:800}
.jx .hbar{display:flex;height:6px;margin-top:4px;border-radius:3px;overflow:hidden;background:#e9eef4}
.jx .road0,.jx .road1{fill:none;stroke:#ffffff;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.jx .road0{stroke-width:2.6;opacity:.95}.jx .road1{stroke-width:1.4;opacity:.8}
.jx .roadname{position:absolute;font-size:11px;font-weight:600;color:#1b2430;white-space:nowrap;letter-spacing:.2px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;transform-origin:center center}
.jx .maptip.compact{font-size:11px;line-height:1.15;padding:3px 5px;border-radius:6px;box-shadow:0 1px 5px #0002}
.jx .maptip.compact .big{font-size:13px;margin:0}.jx .maptip.compact .small{font-size:9.5px}
.jx .maptip.compact .pa,.jx .maptip.compact .pb{font-size:11px;line-height:1.2}.jx .maptip.compact .hbar{height:5px;margin-top:3px}
.jx .leader{stroke:#1b2430;stroke-width:1;opacity:.6}.jx .anchor{fill:#1b2430;stroke:#fff;stroke-width:1.5}
.jx .zb{width:44px;height:44px;border:1px solid #c5cfdb;background:#fff;border-radius:7px;font-size:18px;font-weight:700;color:#024172;line-height:1}
.jx .zb:hover{background:#eef4fa}
.jx .tablebox{overflow:auto;max-height:610px}
.jx table{border-collapse:collapse;width:100%;min-width:720px}
.jx th{position:sticky;top:0;background:var(--wash);color:#46525f;font-size:12px;text-align:right;padding:0;white-space:nowrap;border-bottom:1px solid var(--line)}
.jx th button{all:unset;cursor:pointer;display:block;width:100%;padding:13px 12px;box-sizing:border-box;text-align:inherit;font-weight:700}
.jx td{text-align:right;padding:12px;border-bottom:1px solid #e9eef4}
.jx th:first-child,.jx td:first-child{text-align:left}
.jx tbody tr{cursor:pointer}.jx tbody tr:hover{background:#eef4fa}
.jx .num{font-weight:800;color:var(--brand)}
.jx .drawer{position:fixed;z-index:3000;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-9px 0 38px #0b1d3326;padding:19px 22px;overflow:auto}
.jx .drawer details{border:1px solid var(--line);border-radius:7px;margin:8px 0;padding:9px}
.jx .drawer summary{cursor:pointer;font-weight:750}
.jx .stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.jx .stat strong{text-align:right}
.jx .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:4px 0 16px}
@media(max-width:720px){.jx .chip{padding:3px 6px;font-size:11px}.jx .zb{width:36px;height:36px;font-size:16px}.jx .alltoggle{display:none!important}.jx .lbl{font-size:11px}.jx .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.jx .mapbox{height:62vh;min-height:420px}.jx .pad{padding:15px 12px!important}.jx h1{font-size:23px!important}}
</style>

</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="tpl">

<div class="jx">
<header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dfe6ee; padding: 13px 24px; gap: 12px">
<b style="font-size: 21px; color: #024172">DataSense</b>
<small style="color: #5b6673">Jackson Township · Election results</small>
</header>
<main class="pad" style="max-width: 1540px; margin: 0 auto; padding: 22px 24px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<h1 style="margin: 0 0 12px; font-size: 29px; letter-spacing: -0.7px">Jackson voting districts</h1>
<small style="color: #5b6673">34 districts · 2022–2026</small>
</div>
<section aria-label="Choose what to show" style="border: 1px solid #dfe6ee; padding: 15px 17px; border-radius: 12px; background: #f4f7fb; display: grid; gap: 12px">
<div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end">
<div style="display: grid; gap: 5px; flex: 1; min-width: 235px">
<label class="lbl" for="jx-metric">1 · What to show</label>
<select id="jx-metric" value="{{metric}}" onChange="{{onMetric}}"><option value="turnout">Turnout %</option><option value="registered">Registered voters</option><option value="ballots">Ballots cast</option><option value="candidate">Candidate support %</option><option value="endorse">Communal activist endorsements</option><option value="registrationGrowth">Registration growth % vs comparison year</option><option value="ballotGrowth">Ballots cast growth % vs comparison year</option><option value="growthGap">Ballot growth − registration growth</option></select>
</div>
<div style="display: grid; gap: 5px; min-width: 130px">
<label class="lbl" for="jx-year">2 · Election year</label>
<select id="jx-year" value="{{year}}" onChange="{{onYear}}"><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option></select>
</div>
<sc-if value="{{showOffice}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; gap: 5px; min-width: 130px">
<label class="lbl" for="jx-office">Office</label>
<select id="jx-office" value="{{office}}" onChange="{{onOffice}}">
<sc-for list="{{officeOptions}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}">{{o.v}}</option></sc-for>
</select>
</div>
</sc-if>
<sc-if value="{{showChangeOpt}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; gap: 5px">
<span class="lbl" id="jx-view">3 · View</span>
<div role="group" aria-labelledby="jx-view" style="display: flex; border: 1px solid #c5cfdb; border-radius: 8px; overflow: hidden; background: #ffffff">
<button class="seg" type="button" aria-pressed="{{valuesPressed}}" onClick="{{showValues}}">This year only</button>
<button class="seg" type="button" aria-pressed="{{changePressed}}" onClick="{{showChangeMode}}">Change between years</button>
</div>
</div>
</sc-if>
<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; align-items: center; gap: 7px; min-height: 42px; font-weight: 650"><input type="checkbox" checked="{{inclNeutral}}" onChange="{{toggleNeutral}}">Include neutral votes</label>
</sc-if>
<sc-if value="{{showBase}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; gap: 5px; min-width: 170px">
<label class="lbl" for="jx-base">{{baseStep}} · Compare to</label>
<select id="jx-base" value="{{base}}" onChange="{{onBase}}">
<sc-for list="{{baseOptions}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.t}}</option></sc-for>
</select>
</div>
</sc-if>
<button class="reset" type="button" onClick="{{onReset}}" style="margin-left: auto">↺ Reset</button>
</div>
<sc-if value="{{isCand}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end">
<div style="display: grid; gap: 5px; flex: 1; min-width: 235px">
<label class="lbl" for="jx-cand">Candidate</label>
<select id="jx-cand" value="{{cand}}" onChange="{{onCand}}">
<sc-for list="{{candOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for>
</select>
</div>
<label style="display: flex; align-items: center; gap: 7px; min-height: 42px; font-weight: 650"><input type="checkbox" checked="{{compare}}" onChange="{{onCompare}}">Show second candidate</label>
<sc-if value="{{compare}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; gap: 5px; flex: 1; min-width: 235px">
<label class="lbl" for="jx-second">Second candidate</label>
<select id="jx-second" value="{{second}}" onChange="{{onSecond}}">
<sc-for list="{{secondOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.t}}</option></sc-for>
</select>
</div>
</sc-if>
</div>
</sc-if>
</section>
<div style="display: flex; justify-content: flex-end; margin: 8px 0 0">
<button type="button" onClick="{{toggleKpi}}" aria-expanded="{{kpiOpen}}" style="background: none; border: 0; color: #006EC3; font-weight: 700; font-size: 13px; padding: 8px 4px; min-height: 36px">{{kpiBtn}}</button>
</div>
<sc-if value="{{kpiOpen}}" hint-placeholder-val="{{ true }}">
<div class="kpis">
<div style="border: 1px solid #dfe6ee; padding: 13px 16px; border-radius: 9px"><small style="display: block; color: #5b6673">Registered</small><strong style="font-size: 26px; color: #024172">{{kreg}}</strong></div>
<div style="border: 1px solid #dfe6ee; padding: 13px 16px; border-radius: 9px"><small style="display: block; color: #5b6673">Ballots cast</small><strong style="font-size: 26px; color: #024172">{{kballots}}</strong></div>
<div style="border: 1px solid #dfe6ee; padding: 13px 16px; border-radius: 9px"><small style="display: block; color: #5b6673">Turnout</small><strong style="font-size: 26px; color: #024172">{{kturnout}}</strong></div>
<div style="border: 1px solid #dfe6ee; padding: 13px 16px; border-radius: 9px"><small style="display: block; color: #5b6673">Change in registration · vs {{baseLabel}}</small><strong style="font-size: 26px; color: #024172">{{kgrowth}}</strong></div>
</div>
</sc-if>
<section style="border: 1px solid #dfe6ee; border-radius: 11px; overflow: hidden">
<div style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #dfe6ee; flex-wrap: wrap">
<div><strong style="font-size: 16px">{{viewTitle}}</strong></div>
<div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
<div role="group" aria-label="Map or table" style="display: flex; border: 1px solid #c5cfdb; border-radius: 8px; overflow: hidden; margin-right: 8px"><button class="seg" type="button" aria-pressed="{{mapPressed}}" onClick="{{showMap}}">Map</button><button class="seg" type="button" aria-pressed="{{tablePressed}}" onClick="{{showTable}}">Table</button></div>
<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}"><button class="seg trendbtn" type="button" aria-pressed="{{trendPressed}}" onClick="{{toggleTrend}}">{{trendBtn}}</button></sc-if>
<span class="lbl">Show on map:</span>
<sc-for list="{{fieldList}}" as="f" hint-placeholder-count="6"><label class="chip"><input type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}">{{f.label}}</label></sc-for>
</div>
</div>
<sc-if value="{{isMap}}" hint-placeholder-val="{{ true }}">
<div style="padding: 6px 15px; background: #f8fafc; border-bottom: 1px solid #dfe6ee; color: #5b6673; font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between"><sc-if value="{{chg}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: #1b2430; width: 100%"><span style="width: 14px; height: 14px; border-radius: 3px; background: #A85610"></span>Went down<span style="width: 14px; height: 14px; border-radius: 3px; background: #024172; margin-left: 10px"></span>Went up<span style="font-weight: 400; color: #5b6673; margin-left: 10px">Labels show the change in {{changeUnit}}, {{baseLabel}} → {{year}}</span></span></sc-if>
<sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; width: 100%; color: #1b2430"><b>{{endLegendTitle}}</b><sc-for list="{{endLegend}}" as="lg" hint-placeholder-count="7"><span style="display: inline-flex; align-items: center; gap: 5px"><span class="swatch" style="{{lg.sw}}"></span>{{lg.t}}</span></sc-for></span></sc-if>
<span style="font-weight: 700; color: #1b2430">{{labelKey}}</span>
<label class="alltoggle" style="display: flex; align-items: center; gap: 6px; font-weight: 700; color: #1b2430; min-height: 32px"><input type="checkbox" checked="{{allLabels}}" onChange="{{toggleAll}}">Show every district label</label></div>
<sc-if value="{{h2h}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 16px; border-bottom: 1px solid #dfe6ee; background: #ffffff">
<div style="display: flex; align-items: center; gap: 10px">
<span style="{{h2h.aSw}}" class="swatch"></span>
<div><div style="font-weight: 800; font-size: 15px">{{h2h.aName}}</div><div style="font-size: 12px; color: #5b6673">{{h2h.aPct}} overall · won {{h2h.aWins}} districts</div></div>
</div>
<div style="flex: 1; min-width: 200px; max-width: 420px">
<div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #e9eef4">
<div style="{{h2h.aBar}}"></div><div style="flex: 1"></div><div style="{{h2h.bBar}}"></div>
</div>
<div style="font-size: 11px; color: #5b6673; margin-top: 4px; text-align: center">{{h2h.note}}</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="text-align: right"><div style="font-weight: 800; font-size: 15px">{{h2h.bName}}</div><div style="font-size: 12px; color: #5b6673">{{h2h.bPct}} overall · won {{h2h.bWins}} districts</div></div>
<span style="{{h2h.bSw}}" class="swatch"></span>
</div>
<div style="font-size: 11px; color: #5b6673; width: 100%">{{h2h.lead}}</div>
</div>
</sc-if>
<div class="{{mapClass}}" ref="{{setMap}}" onPointerDown="{{onDown}}">
<svg viewBox="{{viewBox}}" preserveAspectRatio="none" role="group" aria-label="Map of Jackson Township voting districts" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<g>
<sc-for list="{{shapes}}" as="d" hint-placeholder-count="34"><path class="district" d="{{d.p}}" fill="{{d.fill}}" tabIndex="0" role="button" aria-label="{{d.tip}}" onClick="{{d.open}}" onKeyDown="{{d.key}}"><title>{{d.tip}}</title></path></sc-for>
</g>
<g style="pointer-events: none">
<sc-for list="{{roads}}" as="rd" hint-placeholder-count="0"><path class="{{rd.cls}}" d="{{rd.p}}"></path></sc-for>
</g>
</svg>
<div style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{roadLabels}}" as="rl" hint-placeholder-count="0"><div class="roadname" style="{{rl.style}}">{{rl.text}}</div></sc-for>
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible"><sc-for list="{{leaders}}" as="ln" hint-placeholder-count="0"><line class="leader" x1="{{ln.x1}}" y1="{{ln.y1}}" x2="{{ln.x2}}" y2="{{ln.y2}}"></line><circle class="anchor" cx="{{ln.x1}}" cy="{{ln.y1}}" r="3"></circle></sc-for></svg><sc-if value="{{nameKey}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 10px; top: 10px; max-width: 320px; background: #ffffff; border: 1px solid #c9d3de; border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; box-shadow: 0 1px 5px #0002"><sc-for list="{{nameKey}}" as="nk" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 7px; font-size: 13px; color: #1b2430; font-weight: 600"><span class="swatch" style="{{nk.sw}}"></span>{{nk.t}}</span></sc-for></div></sc-if>
<sc-for list="{{labels}}" as="lab" hint-placeholder-count="0"><div class="{{lab.cls}}" style="{{lab.style}}"><sc-for list="{{lab.lines}}" as="ln" hint-placeholder-count="1"><span class="{{ln.cls}}">{{ln.text}}</span></sc-for><sc-if value="{{lab.bar}}" hint-placeholder-val="{{ false }}"><span class="hbar"><span style="{{lab.bar.a}}"></span><span style="flex: 1"></span><span style="{{lab.bar.b}}"></span></span></sc-if></div></sc-for>
</div>
<div style="position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px">
<button class="zb" type="button" aria-label="Zoom in" onClick="{{zoomIn}}" onPointerDown="{{stop}}">+</button>
<button class="zb" type="button" aria-label="Zoom out" onClick="{{zoomOut}}" onPointerDown="{{stop}}">−</button>
<button class="zb" type="button" aria-label="Fit map" onClick="{{fit}}" onPointerDown="{{stop}}" style="font-size: 12px">Fit</button>
</div>
<div style="position: absolute; right: 12px; bottom: 8px; display: flex; align-items: baseline; gap: 8px; background: #ffffffd9; border-radius: 6px; padding: 3px 8px; pointer-events: none"><b style="font-size: 14px; color: #024172">© DataSense</b><span style="font-size: 11px; color: #46525f">info@getdatasense.com</span></div>

</div>
</sc-if>
<sc-if value="{{showTrend}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px 16px; border-top: 1px solid #dfe6ee; background: #ffffff">
<div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 10px">
<strong style="font-size: 16px">Endorsed slate performance by election</strong>
<span style="font-size: 12px; color: #5b6673">Margin = endorsed share minus opposed share, all 34 districts. Click a row to map it.</span>
</div>
<div style="display: grid; gap: 6px">
